<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 128" role="img" aria-labelledby="t">
  <title id="t">Apogeu, vagas de turismo e recepção</title>
  <style>
    /* Sequência única (~2,8 s): o sol nasce do mar, o avião sobe pela trajetória até o
       apogeu e o nome entra. Sem animação, o desenho é a logo estática. */
    .tile   { animation: tile 500ms both; transform-box: fill-box; transform-origin: center; }
    .ring   { animation: draw 700ms 100ms both ease-out; }
    .star   { animation: twinkle 900ms both ease-out; }
    .st1 { animation-delay: 300ms; }
    .st2 { animation-delay: 450ms; }
    .st3 { animation-delay: 600ms; }
    .sun    { animation: rise 900ms 200ms both cubic-bezier(.2,.7,.2,1); }
    .glow   { animation: fade 900ms 500ms both ease-out; }
    .shine  { animation: shine 500ms both cubic-bezier(.2,.7,.2,1); transform-box: fill-box; transform-origin: center; }
    .sh1 { animation-delay: 850ms; }
    .sh2 { animation-delay: 950ms; }
    .sh3 { animation-delay: 1050ms; }
    .sh4 { animation-delay: 1150ms; }
    .trail  { animation: draw 1100ms 700ms both cubic-bezier(.35,.4,.45,1); }
    .plane  { animation: climb 1100ms 700ms both cubic-bezier(.35,.4,.45,1); }
    .ahead  { animation: fade 500ms 1750ms both ease-out; }
    .name   { animation: name 600ms 1900ms both cubic-bezier(.2,.7,.2,1); }
    .sub    { animation: sub 700ms 2150ms both cubic-bezier(.2,.7,.2,1); }

    @keyframes tile    { from { opacity: 0; transform: scale(.86); } to { opacity: 1; transform: none; } }
    @keyframes draw    { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
    @keyframes fade    { from { opacity: 0; } }
    @keyframes twinkle { 0% { opacity: 0; } 40% { opacity: 1; } 100% { opacity: .75; } }
    @keyframes rise    { from { transform: translateY(190px); } to { transform: none; } }
    @keyframes shine   { from { opacity: 0; transform: scaleX(.2); } to { opacity: 1; transform: none; } }
    /* Pontos da curva Q da trajetória (t = 0; 0,25; 0,5; 0,75; 1), relativos ao apogeu
       e divididos pela escala 1,5 do avião; o ângulo acompanha a tangente. */
    @keyframes climb {
      0%   { opacity: 0; transform: translate(-241px, 237px) rotate(-63deg); }
      15%  { opacity: 1; }
      25%  { transform: translate(-181px, 133px) rotate(-56deg); }
      50%  { transform: translate(-121px, 59px) rotate(-44deg); }
      75%  { transform: translate(-60px, 15px) rotate(-26deg); }
      100% { opacity: 1; transform: none; }
    }
    @keyframes name    { from { opacity: 0; transform: translateX(-18px); } to { opacity: 1; transform: none; } }
    @keyframes sub     { from { opacity: 0; transform: translateX(-10px); letter-spacing: 2px; } to { opacity: 1; transform: none; letter-spacing: 4.6px; } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
  <rect width="560" height="128" fill="#0B1A36"/>
  <defs>
    <linearGradient id="ap-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E2147"/>
      <stop offset="0.45" stop-color="#3B3F7A"/>
      <stop offset="0.75" stop-color="#E0745A"/>
      <stop offset="1" stop-color="#F8B25A"/>
    </linearGradient>
    <radialGradient id="ap-sun" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#FFF4C2"/>
      <stop offset="0.6" stop-color="#FFD36B"/>
      <stop offset="1" stop-color="#FFA845"/>
    </radialGradient>
    <radialGradient id="ap-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFD36B" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFD36B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ap-sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1D3F6E"/>
      <stop offset="1" stop-color="#0A1C38"/>
    </linearGradient>
    <clipPath id="ap-clip"><rect width="128" height="128" rx="28"/></clipPath>
    <!-- Revela a trajetória pontilhada junto com o avião -->
    <mask id="ap-trail" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <path class="trail" d="M150 700 Q331 345 512 345" fill="none" stroke="#FFFFFF" stroke-width="40" pathLength="1" stroke-dasharray="1 1"/>
    </mask>
  </defs>
  <!-- Emblema: a logo em 128 px -->
  <g class="tile">
    <g clip-path="url(#ap-clip)">
      <g transform="scale(0.125)">
        <rect width="1024" height="1024" fill="url(#ap-sky)"/>
        <g fill="#FFFFFF">
          <circle class="star st1" cx="250" cy="210" r="9"/>
          <circle class="star st2" cx="760" cy="170" r="11"/>
          <circle class="star st3" cx="840" cy="300" r="8"/>
          <circle class="star st2" cx="180" cy="360" r="8"/>
          <circle class="star st3" cx="640" cy="120" r="8"/>
        </g>
        <!-- Sol nascendo atrás do mar -->
        <circle class="glow" cx="512" cy="660" r="300" fill="url(#ap-glow)"/>
        <circle class="sun" cx="512" cy="660" r="160" fill="url(#ap-sun)"/>
        <!-- Trajetória até o apogeu -->
        <path d="M150 700 Q331 345 512 345" fill="none" stroke="#FFFFFF" stroke-width="20"
              stroke-linecap="round" stroke-dasharray="2 44" opacity="0.9" mask="url(#ap-trail)"/>
        <path class="ahead" d="M512 345 Q693 345 874 700" fill="none" stroke="#FFFFFF" stroke-width="14"
              stroke-linecap="round" stroke-dasharray="2 44" opacity="0.35"/>
        <!-- Montanhas (Pão de Açúcar e Morro da Urca) -->
        <g fill="#0B1A36">
          <path d="M0 740 L0 660 C50 650 100 610 150 612 C205 615 230 670 255 700 C285 672 315 655 345 662 C380 670 400 710 412 740 Z"/>
          <path d="M1024 740 L1024 620 C990 540 935 495 880 505 C830 515 805 600 790 660 C770 648 742 652 722 676 L700 740 Z"/>
        </g>
        <!-- Mar -->
        <rect y="738" width="1024" height="286" fill="url(#ap-sea)"/>
        <g fill="#FFD36B">
          <rect class="shine sh1" x="392" y="760" width="240" height="14" rx="7" opacity="0.85"/>
          <rect class="shine sh2" x="422" y="798" width="180" height="13" rx="6.5" opacity="0.65"/>
          <rect class="shine sh3" x="452" y="834" width="120" height="12" rx="6" opacity="0.45"/>
          <rect class="shine sh4" x="477" y="868" width="70" height="11" rx="5.5" opacity="0.3"/>
        </g>
        <!-- Avião no ponto mais alto -->
        <g transform="translate(512 345) scale(1.5)">
          <g class="plane" fill="#FFFFFF">
            <path d="M60 0 C60 -8 52 -9 44 -9 L-52 -8 C-58 -8 -60 -4 -60 0 C-60 4 -58 8 -52 8 L44 9 C52 9 60 8 60 0 Z"/>
            <path d="M14 -8 L-12 -64 L-26 -64 L-14 -8 Z"/>
            <path d="M14 8 L-12 64 L-26 64 L-14 8 Z"/>
            <path d="M-40 -7 L-54 -28 L-62 -28 L-56 -6 Z"/>
            <path d="M-40 7 L-54 28 L-62 28 L-56 6 Z"/>
          </g>
        </g>
      </g>
    </g>
    <rect class="ring" x="1.5" y="1.5" width="125" height="125" rx="26.5" fill="none" stroke="#FFD36B" stroke-opacity="0.35" stroke-width="3" pathLength="1" stroke-dasharray="1 1"/>
  </g>
  <!-- Nome -->
  <text class="name" x="154" y="74" font-family="Montserrat, 'Segoe UI', system-ui, sans-serif" font-size="56" font-weight="700" letter-spacing="10" fill="#FFF4E0">APOGEU</text>
  <text class="sub" x="157" y="103" font-family="Consolas, 'Cascadia Mono', ui-monospace, monospace" font-size="15" letter-spacing="4.6" fill="#FFC56B">VAGAS DE TURISMO E RECEPÇÃO</text>
</svg>
